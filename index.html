<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luz De Dedicación Cartas 001</title>
  <style>
:root {
  --crimson: #8b1a2e;
  --crimson-light: #b5253f;
  --crimson-pale: rgba(139,26,46,0.07);
  --ink: #18171a;
  --stone: #5a5a5a;
  --parchment: #faf6f0;
  --cream: #f4ede2;
  --white: #fff;
  --border: rgba(0,0,0,0.07);
  --ff-serif: 'Playfair Display', Georgia, serif;
  --ff-sans: 'Inter', system-ui, sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--ff-sans);
  background: var(--parchment);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2rem;
}

.card {
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 3rem 2rem;
  border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.08);
  max-width: 480px;
  width: 100%;
}

h1 {
  font-family: var(--ff-serif);
  font-size: 38px;
  font-weight: 700;
  color: var(--crimson);
  margin-bottom: 1.5rem;
}

.btn-primary {
  display: inline-block;
  background: var(--crimson);
  color: var(--white);
  padding: 0.95rem 2.3rem;
  border: none;
  font-family: var(--ff-sans);
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.25s;
}

.btn-primary:hover {
  background: #6e1324;
  transform: translateY(-2px);
}
  </style>
</head>
<body>

  <main class="card">
    <h1>Luz De Dedicación Cartas 001</h1>
    <a href="https://luzdedicacion.pages.dev/" class="btn-primary" target="_blank" rel="noopener noreferrer">Visitar Sitio</a>
  </main>

  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "559ad2130c9043bc88fc81c584570d64"}'></script>
  </body>
</html>
